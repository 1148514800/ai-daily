[project]
name = "ai-daily-backend"
version = "0.1.0"
description = "AI Daily backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "feedparser>=6.0.14",
    "beautifulsoup4>=4.15.0",
    "sqlalchemy>=2.0",
    "tzdata>=2026.3",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_github_client: use the real GitHubClient.get_repo implementation",
]
